; GameMode (Feral): what changes while a game runs with it. Prism Launcher
; starts it (turned on by the install), Heroic and Faugus with their GameMode
; switch, Steam games with the launch option: gamemoderun %command%
; GPU clocks stay with LACT; core pinning stays at GameMode's default.

[general]
; CPU governor while a game runs and after it: performance, as always on this
; desktop (run-all-desktop.sh sets it at every boot:
; /etc/tmpfiles.d/cpu-governor.conf)
desiredgov=performance
defaultgov=performance
; the game's CPU priority: nice -10 (needs the gamemode group, added by the
; install)
renice=10
; the game's disk priority: best-effort, highest
ioprio=0

[custom]
; the 9950X3D's V-Cache CCD preferred while a game runs; pause the bar's
; visualizer and the Caps Lock check
start=$HOME/.config/gamemode/hook.sh start
end=$HOME/.config/gamemode/hook.sh end
script_timeout=5
