# Password field for the lock screen. Only used when the lock screen unlocks
# with your password: with the YubiKey login (yubikey-setup.sh --login) it
# only accepts a key touch, so there's nothing to type and this isn't loaded.
# Install.sh adds "source = $HOME/.config/hypr/hyprlock-password.conf" to
# hyprlock.conf when you don't choose the YubiKey login (the Clean profile
# always loads it); yubikey-setup.sh removes that line again.
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    rounding = 14
    outer_color = $purple
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = $white
    font_family = JetBrainsMono Nerd Font
    check_color = $white
    fail_color = rgb(224, 108, 117)
    capslock_color = $purple
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -100
    halign = center
    valign = center
}
