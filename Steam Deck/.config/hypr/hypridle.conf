# Steam Deck (tablet): like SteamOS, the screen is NOT locked automatically.
# A Wayland lock screen can't show the on-screen keyboard, so without a keyboard
# (or a plugged-in YubiKey) you couldn't unlock it. Lock by hand with
# `loginctl lock-session` if you have a keyboard or YubiKey connected.
general {
    lock_cmd = pidof hyprlock || hyprlock                            # used only for a manual lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # screen on right after waking up
}

listener {
    timeout = 480                                                    # 8min
    on-timeout = brightnessctl -s set 10%                            # dim the screen (percentage: the Deck's backlight range is large)
    on-resume = brightnessctl -r                                     # restore brightness
}

listener {
    timeout = 1200                                                   # 20min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r  # screen back on
}

listener {
    timeout = 1800                                                   # 30min
    on-timeout = systemctl suspend                                   # sleep
}
