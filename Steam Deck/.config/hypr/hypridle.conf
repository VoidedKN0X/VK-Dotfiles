# Steam Deck (tablet): the screen is locked when the Deck goes to sleep, so the
# lock screen is there when it wakes up. hyprlock only unlocks with a YubiKey
# touch (no keyboard needed) - the same key the Deck already needs to boot.
# It is not locked while you're just idle (the screen only dims and turns off).
general {
    lock_cmd = pidof hyprlock || hyprlock                            # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                         # lock before sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # screen on right after waking up
}

listener {
    timeout = 480                                                    # 8min
    on-timeout = brightnessctl -s set 10%                            # dim the screen (percentage: the Deck's backlight range is large)
    on-resume = brightnessctl -r                                     # restore brightness
}

listener {
    timeout = 1200                                                   # 20min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r  # screen back on
}

listener {
    timeout = 1800                                                   # 30min
    on-timeout = systemctl suspend                                   # sleep
}
