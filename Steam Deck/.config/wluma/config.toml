# wluma: automatic screen brightness for the Steam Deck.
# It reads the Deck's ambient light sensor and learns from you: whenever you
# change the brightness yourself (e.g. with the slider in the notification
# center), it remembers that level for the current light and screen content.

# Light sensor (the Deck's LTRF216A, exposed by the kernel under /sys/bus/iio).
# The numbers are lux values; each range gets its own learned brightness.
[als.iio]
path = "/sys/bus/iio/devices"
thresholds = { 0 = "night", 20 = "dark", 80 = "dim", 250 = "normal", 500 = "bright", 800 = "outdoors" }

# The built-in screen. The backlight device is found automatically from the
# output name; "wayland" lets wluma look at what's on screen as well.
[[output.backlight]]
name = "eDP-1"
capturer = "wayland"
