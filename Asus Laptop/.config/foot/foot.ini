include=~/.config/foot/colors-dark.ini
shell=zsh
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
# 80% solid: darker than the notification panel (58%), for reading text
alpha=0.8
# blur the see-through background: foot tells the compositor itself what to
# blur (ext-background-effect-v1), and on Hyprland 0.56 that request wins over
# Hyprland's own window blur, so without this foot asks for none
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G