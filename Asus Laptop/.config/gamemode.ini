; GameMode (Feral): what changes while a game runs with it. Prism Launcher
; starts it (turned on by the install), Heroic with its GameMode switch, Steam
; games with the launch option: gamemoderun %command%
; GPU clocks and core pinning stay at their defaults.

[general]
; CPU governor: auto-cpufreq is in charge (/etc/auto-cpufreq.conf: full speed
; on AC, battery saving on battery). GameMode can't skip the governor: it
; switches to performance when a game starts, and on battery auto-cpufreq
; switches back on its next check, a few seconds later.
; the game's CPU priority: nice -10 (needs the gamemode group, added by the
; install)
renice=10
; the game's disk priority: best-effort, highest
ioprio=0

[custom]
; pause the bar's visualizer and the Caps Lock check while a game runs
start=$HOME/.config/gamemode/hook.sh start
end=$HOME/.config/gamemode/hook.sh end
script_timeout=5
