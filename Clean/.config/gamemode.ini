; GameMode (Feral, with the gaming extras): what changes while a game runs
; with it. Heroic starts it with its GameMode switch, Steam games with the
; launch option: gamemoderun %command%
; GPU clocks and core pinning stay at their defaults.

[general]
; CPU governor: on a desktop PC always performance (run-all-clean.sh), so
; nothing changes; on a laptop auto-cpufreq is in charge (full speed on AC,
; battery saving on battery) and switches back a few seconds after GameMode
; switched to performance.
; the game's CPU priority: nice -10 (needs the gamemode group, added by the
; install)
renice=10
; the game's disk priority: best-effort, highest
ioprio=0

[custom]
; pause the bar's visualizer and the Caps Lock check while a game runs
start=$HOME/.config/gamemode/hook.sh start
end=$HOME/.config/gamemode/hook.sh end
script_timeout=5
