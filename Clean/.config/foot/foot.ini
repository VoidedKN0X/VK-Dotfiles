include=~/.config/foot/colors-dark.ini
shell=zsh
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
# 32% solid: the same frosted glass as the Quickshell frame and its popups
# (Theme.frame, 42%), a bit more see-through, with Hyprland's blur behind it
# (hypr/hyprland/decoration.lua) keeping the text readable
alpha=0.32
# also see-through where a program paints the same color as foot's
# background (btop, nvim and other full-screen programs do), not only where
# nothing is painted, so the glass stays glass in them too
alpha-mode=matching
# blur the see-through background: foot tells the compositor itself what to
# blur (ext-background-effect-v1), and on Hyprland 0.56 that request wins over
# Hyprland's own window blur, so without this foot asks for none
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G